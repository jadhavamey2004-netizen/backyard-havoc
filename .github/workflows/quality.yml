name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  browser-smoke:
    name: Chromium browser smoke tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Build isolated Pixi spike for bundle-cost evidence
        run: npm run build:pixi-spike

      - name: Run full Chromium desktop, touch, and release smoke tests
        run: npm run test:e2e -- --project=chromium --project=chromium-touch --project=chromium-pixi-touch --project=chromium-release

      - name: Assert production bundle hygiene
        run: node scripts/assert-production-build.mjs

      - name: Record representative prop collision comparison
        run: npm run compare:remaster-collision

      - name: Upload browser reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  phase13-linux-snapshot-bootstrap:
    name: Phase 13 Linux snapshot bootstrap (temporary)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Build isolated Pixi spike for visual/performance comparison
        run: npm run build:pixi-spike

      - name: Capture platform-specific Linux visual baselines
        run: npx playwright test tests/e2e/phase13_visual_evidence.e2e.js --project=chromium-release --update-snapshots

      - name: Upload one-time Linux snapshot bootstrap artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase13-linux-snapshot-bootstrap
          path: |
            tests/e2e/phase13_visual_evidence.e2e.js-snapshots/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  cross-browser-release-smoke:
    name: Firefox and WebKit release smoke tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox and WebKit with system dependencies
        run: npx playwright install --with-deps firefox webkit

      - name: Run Firefox and WebKit release smoke tests
        run: npm run test:e2e -- --project=firefox-release --project=webkit-release

      - name: Upload Firefox and WebKit reports and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase12-cross-browser-evidence
          path: |
            playwright-report/
            test-results/
            tests/e2e/phase13_visual_evidence.e2e.js-snapshots/
            public/assets/generated/phase13-asset-manifest.json
          if-no-files-found: warn
          retention-days: 7
