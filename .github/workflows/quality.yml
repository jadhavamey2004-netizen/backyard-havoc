name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  browser-smoke:
    name: Chromium browser smoke tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
