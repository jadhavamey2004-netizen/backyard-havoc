name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  browser-smoke:
    name: Chromium desktop, touch, and normal release smoke tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run Chromium desktop, touch, and normal release smoke tests
        run: npm run test:e2e -- --project=chromium --project=chromium-touch --project=chromium-release

      - name: Assert production bundle hygiene
        run: node scripts/assert-production-build.mjs

      - name: Record representative prop collision comparison
        run: npm run compare:remaster-collision

      - name: Upload normal Chromium reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-release-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  pixi-browser-smoke:
    name: Chromium Pixi touch, renderer, and visual evidence
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Build isolated Pixi spike for bundle-cost evidence
        run: npm run build:pixi-spike

      - name: Run isolated Pixi touch and release projects
        run: npm run test:e2e -- --project=chromium-pixi-touch --project=chromium-pixi-release --update-snapshots

      - name: Upload refreshed Linux visual snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase14-linux-snapshot-refresh
          path: tests/e2e/phase13_visual_evidence.e2e.js-snapshots/*-chromium-release-linux.png
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pixi browser reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase13-pixi-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  cross-browser-release-smoke:
    name: Firefox and WebKit release smoke tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox and WebKit with system dependencies
        run: npx playwright install --with-deps firefox webkit

      - name: Install virtual display for headed software-WebGL browsers
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Run Firefox and WebKit release smoke tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run --auto-servernum npm run test:e2e -- --project=firefox-release --project=webkit-release

      - name: Upload Firefox and WebKit reports and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase12-cross-browser-evidence
          path: |
            playwright-report/
            test-results/
            tests/e2e/phase13_visual_evidence.e2e.js-snapshots/
            public/assets/generated/phase13-asset-manifest.json
          if-no-files-found: warn
          retention-days: 7
