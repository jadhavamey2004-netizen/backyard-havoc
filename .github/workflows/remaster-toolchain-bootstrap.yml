name: Remaster Toolchain Bootstrap

on:
  push:
    branches:
      - codex/phase-13-visual-remaster-toolchain
    paths:
      - .github/workflows/remaster-toolchain-bootstrap.yml

permissions:
  contents: write

jobs:
  install-remaster-packages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out remaster branch
        uses: actions/checkout@v7
        with:
          ref: codex/phase-13-visual-remaster-toolchain

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Install remaster runtime dependencies
        run: npm install --save-exact pixi.js@8.22.0 poly-decomp@0.3.0

      - name: Install remaster development dependencies
        run: npm install --save-dev --save-exact @assetpack/core@1.7.0 svgo@4.1.0 lil-gui@0.21.0

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Commit package installation
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Install visual remaster toolchain packages"
          git push origin HEAD:codex/phase-13-visual-remaster-toolchain
